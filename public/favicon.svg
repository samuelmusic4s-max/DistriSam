<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    /* Light Mode (Default) - Dark Background, Light Text */
    .bg { fill: #1A1A1A; }
    .text { 
        fill: #F9F6F0; 
        font-family: system-ui, -apple-system, sans-serif; 
        font-weight: 800; 
        font-size: 46px; 
        letter-spacing: -2px; 
    }
    .accent { fill: #c5a059; }
    .ring { stroke: #c5a059; }
    
    /* Dark Mode - Light Background, Dark Text */
    @media (prefers-color-scheme: dark) {
      .bg { fill: #F9F6F0; }
      .text { fill: #1A1A1A; }
    }
  </style>
  
  <!-- Fondo (Squircle) -->
  <rect width="100" height="100" rx="28" class="bg" />
  
  <!-- Anillo Decorativo Dorado -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="none" stroke-width="4" class="ring" />
  
  <!-- Iniciales -->
  <text x="50" y="66" text-anchor="middle" class="text">DS</text>
  
  <!-- Detalle sutil arriba (punto dorado) -->
  <circle cx="50" cy="20" r="4" class="accent" />
</svg>
